# release.conf: jusage's release settings, sourced by release.sh.
# shellcheck shell=bash disable=SC2034

APP_NAME="jusage"
BUNDLE_ID_PREFIX="com.goatdguild.jusage"
TAG_PREFIX="CUT"                         # git tag = CUT-<version>
MIN_MACOS="13.0"                         # SMAppService (login item) needs macOS 13
APP_ARCHS="arm64 x86_64"
ENTITLEMENTS="scripts/jusage.entitlements"   # relative to the repo root
DMG_BACKGROUND=""
DMG_EXTRAS=()

# The engine rides inside the app (Contents/Resources/engine), so the gate checks it as well.
REQUIRED_RESOURCES=(uninstall.sh uninstall.manifest VERSION themes.json AppIcon.icns engine/claude_usage.py engine/bin/jusage)
REQUIRED_PAGES=("Manual.pdf|Manual.html" "WhatsNew.html|WhatsNew.txt" "Licenses.html|Licenses.txt")
SINGLE_ARCH_OK=()

# The identity is not set here: release.sh reads the Developer ID Application identity from the keychain.

# build_app <out-dir> <version> <build-number>: app/build-app.sh builds the UNSIGNED universal app into <out-dir>/jusage.app.
# release.sh is the one place that signs.
build_app() {
  run bash "$REPO_ROOT/app/build-app.sh" "$1" || die "app/build-app.sh failed"
}
