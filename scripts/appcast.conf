# appcast.conf: jusage's Sparkle feed settings, read by appcast.sh (environment values win).
# shellcheck shell=bash disable=SC2034
APP_NAME="jusage"
REPO_SLUG="thuhmadhatter42/claude-usage-tracker"
# Releases live on GitHub Releases. Each version's DMG is at <prefix>CUT-<version>/jusage-<version>.dmg;
# the feed itself is <prefix without "download/">latest/download/appcast.xml (Info.plist SUFeedURL).
DOWNLOAD_PREFIX="https://github.com/thuhmadhatter42/claude-usage-tracker/releases/download/"
RELEASE_TAG_PREFIX="CUT"
